[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-brain"
version = "0.1.0"
description = "Guarded computer-use handoff and closed-question wiring. The caller decides."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Talal Kashar"}]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/talalkashar/jev-brain"
Repository = "https://github.com/talalkashar/jev-brain"
Issues = "https://github.com/talalkashar/jev-brain/issues"

[project.scripts]
jev-brain = "jev_brain.cli:main"
jev-brain-mcp = "jev_brain.mcp_server:main"

systemone = "jev_brain.legacy:cli"
systemone-mcp = "jev_brain.legacy:mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_brain = ["skill/SKILL.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.pyflakes]
allowed-unused-imports = ["srcpath"]
