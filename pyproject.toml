[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone"
version = "0.1.0"
description = "Preview agent desktop handoffs and test closed questions with a local mock."
readme = {file = "RELEASE.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Talal Kashar"}]
dependencies = []
keywords = ["computer-use", "mcp", "cli", "dry-run", "agent-tools"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/talalkashar/jev-brain"
Repository = "https://github.com/talalkashar/jev-brain"
Issues = "https://github.com/talalkashar/jev-brain/issues"
Changelog = "https://github.com/talalkashar/jev-brain/blob/main/CHANGELOG.md"

[project.scripts]
systemone = "systemone.cli:main"
systemone-mcp = "systemone.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systemone = ["skill/SKILL.md"]
